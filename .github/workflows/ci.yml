name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

      # Also covered by `pnpm test` (tests/unit/decisions.test.ts), but that waits three minutes
      # for Postgres. A number taken twice is exactly what a branch discovers late, so it is said
      # here, in a second, before the stack starts.
      - run: pnpm check:decisions

      # Postgres with the migrations and supabase/seed.sql applied: tests/unit/rls.test.ts
      # connects to it directly on DATABASE_URL.
      #
      # Pinned, not `latest`: resolving « latest » is a call to the GitHub releases API from a
      # shared runner, and it answered `rate limit exceeded` twice in fifteen minutes, killing
      # two runs before a single test had started. A version reaches its asset directly. It is
      # the one in devDependencies, so CI installs what a contributor runs.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: supabase db start
      - run: supabase db reset --local

      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Touch audit (5 viewports)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  journeys:
    name: Parcours SPEC 6.1-6.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The journeys sign a real user in and write real rows, so they need Auth and PostgREST,
      # not just Postgres: the whole stack, on this runner, never the production project (D81).
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: supabase start
      - run: supabase db reset --local

      # The stack prints its own URL and keys; the app and the tests read them from here, so
      # nothing about a local key is written down in the repository.
      - name: Export the local stack's URL and keys
        run: |
          supabase status -o env | sed 's/^/SUPABASE_/' > /tmp/stack.env
          . /tmp/stack.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$SUPABASE_API_URL"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - run: pnpm test:e2e:journeys

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-journeys
          path: test-results
          retention-days: 7
