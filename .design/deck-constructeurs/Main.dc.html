<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: Manrope, ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: #8a6a22; } a:hover { color: #6d5319; }
  </style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 140px; padding: 96px 112px; color: #ffffff; background-image: radial-gradient(120% 140% at 100% 0%, #2a4a74 0%, transparent 55%), linear-gradient(150deg, #081426 0%, #0c1b33 42%, #1e3a5f 100%);">

  <div style="display: flex; flex-direction: column; gap: 32px;">
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div style="font-size: 20px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #e3b879;">Xaman · carnet d'entretien des bateaux</div>
      <div style="width: 96px; height: 2px; background: #8a6a22;"></div>
    </div>
    <h1 style="margin: 0; max-width: 1400px; font-family: Fraunces, 'Iowan Old Style', Palatino, Georgia, serif; font-weight: 600; font-size: 88px; line-height: 1.1; letter-spacing: -0.015em; text-wrap: pretty;">Vous livrez le bateau.<br>Ensuite, vous ne savez plus rien.</h1>
  </div>

  <div style="display: flex; align-items: stretch; gap: 0;">
    <div style="display: flex; flex-direction: column; justify-content: center; gap: 12px; width: 520px; padding: 28px 36px 28px 0; box-sizing: border-box;">
      <div style="font-size: 19px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #e3b879;">Le jour de la livraison</div>
      <div style="font-size: 34px; line-height: 1.25; color: #ffffff; text-wrap: balance;">Deux pertes, le même jour.</div>
    </div>

    <div style="display: flex; align-items: center; padding: 0 8px;">
      <svg width="104" height="232" viewBox="0 0 104 232" fill="none" aria-hidden="true">
        <path d="M0 116 H28 C60 116 60 38 92 38" stroke="#35496a" stroke-width="2" stroke-linecap="round"></path>
        <path d="M0 116 H28 C60 116 60 194 92 194" stroke="#35496a" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="6" cy="116" r="6" fill="#e3b879"></circle>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; justify-content: space-between; gap: 24px; flex-grow: 1;">
      <div style="display: flex; align-items: center; gap: 20px; padding: 26px 32px; background: #1b2a45; border: 1px solid #35496a; border-radius: 12px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff8a8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M12 3 4 7v6c0 4.4 3.4 7.4 8 8 4.6-.6 8-3.6 8-8V7l-8-4Z"></path><path d="M12 9v4"></path><path d="M12 16h.01"></path></svg>
        <div style="font-size: 28px; line-height: 1.3; color: #ffffff;"><span style="font-weight: 600">L'acheteur</span>&nbsp;: seul, sans carnet et avec une doc qu'il ne lira pas.</div>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; padding: 26px 32px; background: #1b2a45; border: 1px solid #35496a; border-radius: 12px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffa35c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;" aria-hidden="true"><path d="M3 20h18"></path><path d="M5 20V9l7-5 7 5v11"></path><path d="M10 20v-6h4v6"></path></svg>
        <div style="font-size: 28px; line-height: 1.3; color: #ffffff;"><span style="font-weight: 600;">Le chantier</span> — plus une ligne sur une coque qu'il a construite.</div>
      </div>
    </div>
  </div>

</div>
</x-dc>

</html>
